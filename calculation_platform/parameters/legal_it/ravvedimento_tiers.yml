values:
  - parameter_id: legal_it.ravvedimento_omesso_versamento_tiers
    value:
      # Omesso/tardivo versamento, violazioni commesse dal 1/9/2024
      # (D.Lgs. 87/2024): sanzione base 25% (art. 13 D.Lgs. 471/1997),
      # ridotta al 12,5% se il versamento avviene entro 90 giorni, e
      # ulteriormente rapportata ai giorni (1/15 per giorno) entro i 14
      # giorni. Riduzioni da ravvedimento ex art. 13 D.Lgs. 472/1997.
      tiers:
        - max_days: 14
          type: per_day
          rate: 0.000833333333   # 12,5% x 1/15 x 1/10 per giorno (0,0833%/giorno)
          label: "Ravvedimento sprint (entro 14 giorni): 0,0833% per giorno di ritardo"
        - max_days: 30
          type: flat
          rate: 0.0125           # 1/10 di 12,5%
          label: "Ravvedimento breve (15-30 giorni): 1/10 del 12,5%"
        - max_days: 90
          type: flat
          rate: 0.013888888889   # 1/9 di 12,5%
          label: "Ravvedimento intermedio (31-90 giorni): 1/9 del 12,5%"
        - boundary: declaration_deadline
          fallback_max_days: 365
          type: flat
          rate: 0.03125          # 1/8 di 25%
          label: "Ravvedimento lungo (entro il termine della dichiarazione dell'anno della violazione, o 1 anno per i tributi senza dichiarazione): 1/8 del 25%"
        - max_days: null
          type: flat
          rate: 0.035714285714   # 1/7 di 25%
          label: "Ravvedimento ultrannuale (oltre): 1/7 del 25%"
    effective_from: 2024-09-01
    source: "Art. 13 D.Lgs. 472/1997 e art. 13 D.Lgs. 471/1997, come modificati dal D.Lgs. 14 giugno 2024, n. 87"
    official: true
    citations:
      - reference: "Art. 13 D.Lgs. 18 dicembre 1997, n. 472 — ravvedimento (riduzioni della sanzione)"
        source_name: "Normattiva — D.Lgs. 472/1997 (testo vigente)"
        publisher: "Istituto Poligrafico e Zecca dello Stato"
        url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:1997-12-18;472"
        official: true
      - reference: "Art. 13 D.Lgs. 18 dicembre 1997, n. 471 — ritardati od omessi versamenti (sanzione 25% per violazioni dal 1/9/2024)"
        source_name: "Normattiva — D.Lgs. 471/1997 (testo vigente)"
        publisher: "Istituto Poligrafico e Zecca dello Stato"
        url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:1997-12-18;471"
        official: true
      - reference: "D.Lgs. 14 giugno 2024, n. 87 — revisione del sistema sanzionatorio tributario (violazioni commesse dal 1° settembre 2024)"
        source_name: "Gazzetta Ufficiale Serie Generale n. 150 del 28/06/2024"
        publisher: "Istituto Poligrafico e Zecca dello Stato"
        publication_date: "2024-06-28"
        official: true
