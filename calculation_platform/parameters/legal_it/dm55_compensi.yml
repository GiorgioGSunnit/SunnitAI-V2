    unit: fee_table
    effective_from: 2022-10-23
    source: "DM 10 marzo 2014 n. 55, Tabella 2, come sostituita dal DM 13 agosto 2022 n. 147 (G.U. Serie Generale n. 236 del 08/10/2022) — VALORI SEGNAPOSTO"
    official: false
    verified: false
