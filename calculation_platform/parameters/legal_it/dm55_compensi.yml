_note: >
  Parametri forensi DM 10 marzo 2014 n. 55, come modificato dal DM 13 agosto
  2022 n. 147 (in vigore dal 23 ottobre 2022) — valori MEDI di liquidazione
  per i giudizi ordinari di cognizione, per scaglione di valore della causa
  e per fase (studio / introduttiva / istruttoria / decisionale).

  FONTE AUTORITATIVA: Allegato (Tabella 2 — giudizi ordinari di cognizione
  innanzi al Tribunale) al DM 55/2014 aggiornato dal DM 147/2022,
  G.U. Serie Generale n. 236 dell'08/10/2022.

  ATTENZIONE — VALORI SEGNAPOSTO: SOLO lo scaglione 26.000,01-52.000 e
  popolato, con numeri SINTETICI (placeholder: true, verified: false) che
  NON sono i valori ministeriali reali. Gli altri scaglioni sono stub di
  schema con valore_medio: null (TO_VERIFY) e non risolvono mai: una causa
  che vi ricade produce un errore strutturato. Prima dell'uso reale caricare
  l'intera Tabella 2 dal decreto e impostare verified: true /
  placeholder: false. Vedi docs/TO_VERIFY.md.

values:
