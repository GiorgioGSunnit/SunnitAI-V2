_note: >
  Parametri forensi DM 10 marzo 2014 n. 55, come modificato dal DM 13 agosto
  2022 n. 147 (in vigore dal 23 ottobre 2022) — valori MEDI di liquidazione
  per i giudizi ordinari di cognizione innanzi al Tribunale (Tabella 2), per
  scaglione di valore della causa e per fase (studio / introduttiva /
  istruttoria / decisionale).

  FONTE AUTORITATIVA: Allegato (Tabella 2 — giudizi ordinari di cognizione
  innanzi al Tribunale) al DM 55/2014 aggiornato dal DM 147/2022,
  G.U. Serie Generale n. 236 dell'08/10/2022 (codice redazionale 22G00157).

  Valori dei sei scaglioni fino a 520.000 EUR verificati contro l'allegato
  ufficiale (Tabella 2, DM 147/2022) — `verified: true`. Le cause di valore
  SUPERIORE a 520.000 EUR non hanno una settima riga tabellare: l'art. 6
  DM 55/2014 prevede un aumento progressivo fino al 30% e la strategia
  restituisce un risultato di "fascia non supportata" anziché inventare un
  valore.

