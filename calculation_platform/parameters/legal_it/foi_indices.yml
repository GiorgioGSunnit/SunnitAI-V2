_note: >
  Serie mensile dell'indice ISTAT FOI (indice dei prezzi al consumo per le
  famiglie di operai e impiegati, SENZA tabacchi) — la serie usata per la
  rivalutazione monetaria dei crediti (art. 429 c.p.c., debiti di valore).

  FONTE AUTORITATIVA: ISTAT, "Indice FOI senza tabacchi". I coefficienti
  calcolati con questa serie sono verificabili con il calcolatore ufficiale
  ISTAT su https://rivaluta.istat.it .

  CONVENZIONE (final-month convention): la rivalutazione tra una data A e una
  data B usa l'indice FOI del MESE di A e l'indice FOI del MESE di B —
  coefficiente = FOI(mese di B) / FOI(mese di A). Nessuna interpolazione
  infra-mese; un mese assente nella serie produce un errore strutturato,
  mai un valore interpolato o di ripiego.

  BASE DELL'INDICE: da gennaio 2026 la base di riferimento e 2025=100
  (prima 2015=100). Ogni voce dichiara `base_year`; indici di basi diverse
  NON si dividono direttamente — la strategia applica il coefficiente di
  raccordo dichiarato in `base_links` (ISTAT: moltiplicando un indice base
  2025 per 1,214 si ottiene il corrispondente valore in base 2015).

  COPERTURA PARZIALE: sono caricati solo i mesi finora verificati (2021
  gen-giu in base 2015 e giu 2026 in base 2025). La serie storica completa
  va ancora ingerita in blocco dal sito ISTAT; i mesi assenti falliscono in
  modo strutturato. Giugno 2026 e l'ultimo mese pubblicato al 2026-07-24
  (luglio 2026 non ancora pubblicato). Vedi docs/TO_VERIFY.md.

# Coefficienti di raccordo tra basi (value_in_to_base = value_in_from_base * coefficient)
base_links:
  - parameter_id: legal_it.foi_index
    from_base: 2025
    to_base: 2015
    coefficient: 1.214
    source: "ISTAT — coefficiente di raccordo base 2025=100 con la precedente base 2015=100"

