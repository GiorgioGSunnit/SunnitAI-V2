_note: >
  Serie mensile dell'indice ISTAT FOI (indice dei prezzi al consumo per le
  famiglie di operai e impiegati, SENZA tabacchi) — la serie usata per la
  rivalutazione monetaria dei crediti (art. 429 c.p.c., debiti di valore).

  FONTE AUTORITATIVA: ISTAT, "Indice FOI senza tabacchi". I coefficienti
  calcolati con questa serie sono verificabili con il calcolatore ufficiale
  ISTAT su https://rivaluta.istat.it .

  CONVENZIONE (final-month convention): la rivalutazione tra una data A e una
  data B usa l'indice FOI del MESE di A e l'indice FOI del MESE di B —
  coefficiente = FOI(mese di B) / FOI(mese di A). Nessuna interpolazione
  infra-mese; un mese assente nella serie produce un errore strutturato,
  mai un valore interpolato o di ripiego.

  ATTENZIONE — VALORI SEGNAPOSTO: le voci qui sotto sono SOLO esempi di
  schema con numeri sintetici (placeholder: true, verified: false). NON sono
  dati ISTAT reali e NON devono essere usati per calcoli operativi. Prima
  dell'uso reale caricare in blocco la serie storica ufficiale dal sito ISTAT
  (serie "FOI(nt) — indici nazionali", base di riferimento corrente) e
  impostare verified: true / placeholder: false con last_verified_at.
  Vedi docs/TO_VERIFY.md.

