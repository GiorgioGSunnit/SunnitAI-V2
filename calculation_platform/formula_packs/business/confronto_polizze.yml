id: business.confronto_polizze
name: Confronto polizze assicurative (punteggio 0-100)
category: business
strategy: comparator
methodology: "Punteggio 0-100 basato su coperture, condizioni, servizi e recensioni; premio annuo indicativo = 300 EUR + (100 - punteggio) * 35 EUR."
version: "3"
description: >
  Confronta due o piu polizze assicurative (auto/casa) assegnando a ciascuna
  un punteggio 0-100 composto da quattro componenti (coperture, condizioni,
  servizi, recensioni) con pesi dichiarati che sommano a 1. Dopo il
  punteggio calcola un premio annuo indicativo: 300 EUR a 100/100, piu
  35 EUR per ogni punto sotto 100. Il premio eventualmente dichiarato
  dall'utente viene raccolto per compatibilita ma non influenza ne il
  punteggio ne il premio calcolato.
jurisdiction: null
output_unit: null
keywords:
  - confronto polizze
  - comparatore assicurazioni
  - insurance comparison
  - confronto assicurazione auto
  - confronto assicurazione casa
  - punteggio polizza
aliases:
  - quale polizza mi conviene
  - confronta queste assicurazioni
  - qual e l'assicurazione migliore tra queste
tags:
  - assicurazione
  - polizza
  - confronto
  - comparatore
intent_examples:
  - confronta due polizze auto e dimmi quale conviene
  - classifica queste offerte assicurative
negative_examples:
  - quanto costa in media un'assicurazione auto
  - confronta due offerte gas e luce e dimmi quale conviene
  - quale fornitore di luce e gas conviene
  # Mirror of the energy pack's own negatives: both packs answer to
  # confronta/queste/offerte, so without a penalty an energy request ties
  # with this one on generic tokens and wins on alphabetical order.
  - confronta queste offerte energia
  - classifica questi fornitori di energia
  # Document comparison is a different feature entirely; without these a
  # request to compare two uploaded files scores on "confronta questi ..."
  # alone and is hijacked into a calculator that has no offers to compare.
  - confronta questi documenti
  - confronta questi allegati
  - confronta questi contratti
ambiguity_notes: >
  Richiede i dati di almeno due polizze concrete. Il premio prodotto e
  esclusivamente il risultato della regola tariffaria dimostrativa
  dichiarata, non un preventivo di mercato.
inputs:
  # Applicant facts are shared: the same driver is requesting every quote.
  # They are collected, validated, echoed in inputs_used and recorded in the
  # audit trail as a `shared_inputs` step — but they are deliberately NOT
  # scored. Being identical across every candidate they can only shift all
  # totals by the same amount, which changes no ranking while making the
  # score look better informed than it is. Only candidate-specific
  # conditions (franchigia, guida esclusiva) separate the offers.
  - name: eta_conducente
    type: integer
    required: true
    min_value: 18
    max_value: 110
    description: Eta del conducente principale (uguale per tutte le polizze; registrata, non usata nel punteggio)
  - name: storico_sinistri
    type: integer
    required: false
    default: 0
    min_value: 0
    max_value: 100
    description: Numero di sinistri del conducente negli ultimi anni (registrato, non usato nel punteggio)
  - name: polizze
    type: object_list
    required: true
    min_items: 2
    description: Le polizze da confrontare, con i dati di ciascuna offerta
    item_fields:
      - name: nome
        type: string
        required: true
        description: Nome identificativo della polizza/compagnia
      - name: premio_annuo
        type: decimal
        required: false
        min_value: 0.01
        unit: EUR
        description: Premio annuo eventualmente dichiarato (raccolto per compatibilita, non usato nel punteggio o nel premio calcolato)
      - name: franchigia
        type: decimal
        required: false
        default: 0
        min_value: 0
        unit: EUR
        description: Franchigia a carico dell'assicurato
      - name: massimale
        type: decimal
        required: false
        min_value: 0
        unit: EUR
        description: Massimale di copertura (raccolto ma non ancora usato nel punteggio)
      - name: copertura_kasko
        type: boolean
        required: false
        default: false
        description: Copertura kasko inclusa
      - name: copertura_cristalli
        type: boolean
        required: false
        default: false
        description: Copertura cristalli inclusa
      - name: copertura_infortuni
        type: boolean
        required: false
        default: false
        description: Copertura infortuni del conducente inclusa
      - name: assistenza_stradale
        type: boolean
        required: false
        default: false
        description: Assistenza stradale inclusa
      - name: guida_esclusiva
        type: boolean
        required: false
        default: false
        description: Formula di guida esclusiva
      - name: sconto_no_sinistri
        type: decimal
        required: false
        default: 0
        min_value: 0
        max_value: 1
        unit: rate
        description: Sconto per assenza di sinistri, come frazione (0,10 per 10%)
      - name: sconto_fedelta
        type: decimal
        required: false
        default: 0
        min_value: 0
        max_value: 1
        unit: rate
        description: Sconto fedelta, come frazione (0,05 per 5%)
      - name: telemedicina
        type: boolean
        required: false
        default: false
        description: Servizio di telemedicina incluso
      - name: app_gestione
        type: boolean
        required: false
        default: false
        description: App di gestione della polizza disponibile
      - name: voto_medio_utenti
        type: decimal
        required: false
        default: 3
        min_value: 1
        max_value: 5
        description: Voto medio degli utenti (scala 1-5)
parameters: []
derived_variables: {}
formula:
  candidates_input: polizze
  label_field: nome
  tie_tolerance: "0.50"
  post_score_derived:
    premio_annuo_calcolato: "300 + (100 - total_score) * 35"
  output_cost:
    variable: premio_annuo_calcolato
    label: premio annuo calcolato
    unit: EUR/anno
  components:
    - name: punteggio_coperture
      weight: "0.50"
      points:
        - {field: copertura_kasko, points: 20}
        - {field: copertura_infortuni, points: 15}
        - {field: copertura_cristalli, points: 10}
        - {field: assistenza_stradale, points: 10}
      scale_max: 55
    # Candidate-specific contractual conditions only. The applicant's age
    # and claims history used to sit here: identical for every offer by
    # definition, they subtracted the same points from everyone and
    # differentiated nothing.
    - name: punteggio_condizioni
      weight: "0.30"
      base: 100
      rules:
        - when: {field: guida_esclusiva, equals: false}
          points: -10
        - when: {field: franchigia, greater_than: 300}
          points: -10
      clamp: {min: 0, max: 100}
    - name: punteggio_servizi
      weight: "0.10"
      points:
        - {field: telemedicina, points: 5}
        - {field: app_gestione, points: 5}
      scale_max: 10
    - name: punteggio_recensioni
      weight: "0.10"
      expression: "voto_medio_utenti * 20"
      clamp: {min: 0, max: 100}
output:
  name: ranking
  round_to: 2
citations: []
warnings:
  - >-
    Pesi e punteggi delle componenti sono valori dimostrativi da concordare
    con il business prima dell'uso operativo: l'aritmetica e esatta, la
    validita del modello di punteggio no.
  - >-
    Il punteggio 0-100 e una sintesi basata sui dati forniti e sui pesi qui
    dichiarati, non una misura oggettiva di qualita di mercato.
assumptions:
  - "Il premio annuo calcolato segue esclusivamente la formula 300 EUR + (100 - punteggio totale) * 35 EUR."
  - "Un punteggio di 100/100 produce 300 EUR annui; ogni punto in meno aggiunge 35 EUR annui."
  - "Il premio di listino e gli sconti eventualmente dichiarati sono raccolti per compatibilita ma non incidono sul punteggio o sul premio calcolato."
  - "Eta del conducente e storico sinistri sono del richiedente, identici per tutte le polizze: sono registrati negli input e nel percorso di calcolo ma non entrano nel punteggio, perche non possono distinguere un'offerta dall'altra."
  - "Sono valutate come condizioni solo le clausole specifiche dell'offerta: franchigia e formula di guida esclusiva."
  - "Se due offerte restano entro 0,50 punti totali il confronto dichiara una sostanziale parita e non indica un vincitore."
exclusions:
  - "Il massimale, il premio dichiarato e gli sconti sono raccolti ma non entrano nel punteggio."
  - "Eta del conducente e storico sinistri non incidono sul punteggio: sono uguali per tutte le offerte confrontate."
  - "Il premio annuo calcolato applica una regola tariffaria dimostrativa e non stima ne verifica i premi di mercato."
  - "Non verifica la veridicita dei dati delle offerte ne le condizioni contrattuali non dichiarate (massimali per garanzia, esclusioni di polizza, rivalse)."
examples:
  - description: "Stesso conducente (22 anni), due polizze auto: la A copre di piu, ottiene il punteggio migliore e il premio calcolato minore"
    inputs:
      eta_conducente: 22
