id: legal_it.compensi_dm55
name: Compensi forensi (DM 55/2014, giudizi ordinari di cognizione)
category: legal_it
strategy: dm55_fees
version: "1"
description: >
  Liquidazione dei compensi dell'avvocato per i giudizi ordinari di
  cognizione secondo i parametri del DM 10 marzo 2014 n. 55 (come
  modificato dal DM 13 agosto 2022 n. 147): somma dei valori MEDI delle
  fasi richieste (studio, introduttiva, istruttoria, decisionale) per lo
  scaglione di valore della causa, eventuale aumento (max 80%) o riduzione
  (max 50%, fino al 70% per la sola fase istruttoria), quindi la catena
  +15% rimborso spese generali (art. 2 DM 55/2014), +4% CPA, +22% IVA,
  con il subtotale esplicitato a ogni passaggio.
jurisdiction: IT
output_unit: EUR
keywords:
  - compensi avvocato
  - compenso avvocato
  - parcella avvocato
  - parametri forensi
  - dm 55 2014
  - liquidazione compenso
  - tariffe forensi
  - fasi di giudizio
  - spese generali cpa iva
aliases:
  - quanto costa l'avvocato per una causa
  - calcolo parcella avvocato
  - compenso liquidato dal giudice
tags:
  - compensi
  - avvocato
  - parcella
intent_examples:
  - compenso avvocato per una causa civile
  - quanto costa l'avvocato per una causa
  - liquidazione dei compensi secondo il dm 55
  - calcolo parcella con spese generali cpa e iva
required_context:
  - valore della causa e fasi svolte
ambiguity_notes: >
  Il contributo unificato e un tributo di iscrizione a ruolo, non un
  compenso professionale: per quello usare
  legal_it.contributo_unificato_civile.
inputs:
  - name: valore_causa
    type: decimal
    required: true
    unit: EUR
    min_value: 0
    description: Valore della causa (determina lo scaglione DM 55)
  - name: fasi
    type: string_list
    required: true
    description: >
      Fasi svolte, sottoinsieme di: studio, introduttiva, istruttoria,
      decisionale (lista o stringa separata da virgole)
  - name: aumento_pct
    type: decimal
    required: false
    unit: percent
    description: Aumento percentuale sul compenso tabellare (0-80, art. 4 DM 55/2014)
  - name: riduzione_pct
    type: decimal
    required: false
    unit: percent
    description: >
      Riduzione percentuale sul compenso tabellare (0-50; fino a 70 solo se
      l'unica fase e istruttoria, art. 4 DM 55/2014)
parameters:
  - name: dm55_compensi
    parameter_id: legal_it.dm55_compensi_cognizione
    resolver: date
    description: Tabella 2 DM 55/2014 (valori medi per scaglione e fase), versionata per data
formula:
  table_parameter_id: legal_it.dm55_compensi_cognizione
  amount_input: valore_causa
  phases_input: fasi
output:
  name: totale
  round_to: 2
  min: 0
citations:
  - reference: "DM 10 marzo 2014, n. 55 — Regolamento recante la determinazione dei parametri per la liquidazione dei compensi per la professione forense (art. 2: rimborso forfettario spese generali 15%; art. 4: aumenti e riduzioni)"
    source_name: "Gazzetta Ufficiale Serie Generale n. 77 del 02/04/2014"
    publisher: "Gazzetta Ufficiale della Repubblica Italiana"
    publication_date: "2014-04-02"
    url: "https://www.gazzettaufficiale.it/eli/id/2014/04/02/14G00067/sg"
    official: true
  - reference: "DM 13 agosto 2022, n. 147 — modifiche al DM 55/2014 (tabelle dei valori medi vigenti dal 23/10/2022)"
    source_name: "Gazzetta Ufficiale Serie Generale n. 236 del 08/10/2022"
    publisher: "Gazzetta Ufficiale della Repubblica Italiana"
    publication_date: "2022-10-08"
    url: "https://www.gazzettaufficiale.it/eli/id/2022/10/08/22G00156/sg"
    official: true
warnings:
  - "Solo lo scaglione 26.000,01-52.000 e popolato, con VALORI SEGNAPOSTO non ministeriali; gli altri scaglioni sono stub TO_VERIFY e producono un errore."
assumptions:
  - "Usa i valori MEDI di liquidazione della Tabella 2 (giudizi ordinari di cognizione innanzi al Tribunale)."
  - "Catena di calcolo: compenso ± adeguamento, +15% spese generali, +4% CPA sul subtotale, +22% IVA sul subtotale successivo."
exclusions:
  - "Non calcola il contributo unificato ne le spese vive di giudizio."
  - "Non applica i valori minimi/massimi di tabella (solo i medi) ne gli aumenti per pluralita di parti."
examples:
  - description: >
      Golden case con i VALORI SEGNAPOSTO dello scaglione 26.000,01-52.000
      (studio 2000, introduttiva 1500, decisionale 3500): causa da 30.000
      EUR, tre fasi senza adeguamenti. Compenso 7000; +15% spese generali
      1050 -> 8050; +4% CPA 322 -> 8372; +22% IVA 1841.84 -> totale 10213.84.
      verified_against: TODO (official calculator/source check pending)
    inputs:
      valore_causa: 30000
      fasi: ["studio", "introduttiva", "decisionale"]
    expected_result:
      compenso_tabellare: "7000.00"
      spese_generali: "1050.00"
      subtotale_con_spese: "8050.00"
      cpa: "322.00"
      subtotale_con_cpa: "8372.00"
      iva: "1841.84"
      totale: "10213.84"
