id: legal_it.furto_aggravato_draft
name: "[BOZZA] Cornice edittale — furto aggravato (art. 625 c.p.)"
category: legal_it
strategy: penal_range_draft
methodology: "Modifica la cornice edittale base con le aggravanti, le attenuanti, il bilanciamento e l'eventuale rito abbreviato dichiarati."
version: "0.1-draft"
description: >
  BOZZA DIMOSTRATIVA, NON VALIDATA LEGALMENTE. Calcola la cornice
  edittale del furto aggravato ex art. 625 c.p. (reclusione da 2 a 6
  anni e multa da 927 a 1.500 euro), la fattispecie autonoma che copre
  fra l'altro il furto in abitazione e il furto con violenza sulle
  cose. Applica la stessa meccanica dimostrativa del modulo penale:
  circostanze come conteggi generici, scenari art. 69, tetti art. 66,
  riduzione per rito abbreviato. Presuppone che l'aggravante ex art.
  625 sia GIÀ stata qualificata e confermata da un legale: il sistema
  non stabilisce se il fatto rientri nell'art. 624 o nell'art. 625.
jurisdiction: IT
output_unit: null
keywords:
  - furto aggravato
  - furto in abitazione
  - furto in casa
  - furto con scasso
aliases:
  - che pena per furto aggravato
  - che pena per furto in casa
  - che pena per un furto in abitazione
tags:
  - penale
  - furto
  - patrimonio
intent_examples:
  - pena per furto aggravato
  - che pena per furto in abitazione
  - il mio assistito ha rubato in casa che pena rischia
negative_examples:
  - furto semplice
  - furto di un portafoglio
required_context:
  - conferma da parte di un legale che ricorre un'aggravante ex art. 625 c.p.
  - numero di circostanze aggravanti e attenuanti comuni ulteriori confermate dall'avvocato
ambiguity_notes: >
  La distinzione fra furto semplice (art. 624) e furto aggravato (art.
  625) dipende dalla qualificazione giuridica dell'aggravante, che
  deve essere confermata da un legale; il sistema non la accerta. Il
  furto in abitazione in senso stretto (art. 624-bis) ha cornice
  propria (4-7 anni) non coperta da questa bozza.
inputs:
  - name: aggravanti_comuni
    type: integer
    required: true
    min_value: 0
    max_value: 100
    description: Numero di circostanze aggravanti comuni ULTERIORI confermate (0 se nessuna)
  - name: attenuanti_comuni
    type: integer
    required: true
    min_value: 0
    max_value: 100
    description: Numero di circostanze attenuanti comuni confermate (0 se nessuna)
  - name: scenario_art_69
    type: string
    required: false
    description: >
      Scenario di bilanciamento: aggravanti_prevalenti |
      attenuanti_prevalenti | equivalenza. Se omesso con entrambe le
      tipologie presenti, restituisce la matrice degli scenari.
  - name: rito_abbreviato
    type: boolean
    required: false
    default: false
    description: Applica la riduzione di 1/3 per giudizio abbreviato (art. 442 c.p.p.)
parameters: []
formula:
  base_min_years: 2
  base_max_years: 6
  multa_min_eur: 927
  multa_max_eur: 1500
output:
  name: pena
citations:
  - reference: "Art. 625 Codice Penale — Furto aggravato (reclusione da due a sei anni e multa da euro 927 a euro 1.500)"
    source_name: "Codice Penale (R.D. 19 ottobre 1930, n. 1398)"
    publisher: "Normattiva — Istituto Poligrafico e Zecca dello Stato"
    publication_date: "1930-10-19"
    url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:regio.decreto:1930-10-19;1398"
    official: true
warnings:
  - "Calcolo di cornice edittale sotto ipotesi dichiarate: NON è una previsione della sentenza."
  - "La cornice edittale dell'art. 625 c.p. e la sua multa vanno verificate contro il testo vigente prima di qualsiasi uso."
  - "Non copre il furto in abitazione ex art. 624-bis c.p. (cornice autonoma), né le ipotesi pluriaggravate."
assumptions:
  - "L'aggravante ex art. 625 c.p. è già stata qualificata e confermata da un legale: il sistema riceve solo la cornice risultante e il numero di eventuali circostanze comuni ulteriori."
  - "Ogni circostanza comune ha effetto discrezionale da 0 a 1/3 (inviluppo massimo di legge)."
exclusions:
  - "Furto in abitazione e furto con strappo ex art. 624-bis c.p. (cornici autonome)."
  - "Multa: adeguamento per circostanze, tetti art. 66 n. 3 e rito; recidiva e continuazione."
examples:
  - description: "Furto aggravato ex art. 625, nessuna circostanza comune ulteriore"
    inputs:
      aggravanti_comuni: 0
      attenuanti_comuni: 0
    expected_result:
      specie: reclusione
      pena_minima: "2 anni"
      pena_massima: "6 anni"
