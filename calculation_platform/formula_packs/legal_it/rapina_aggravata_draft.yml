id: legal_it.rapina_aggravata_draft
name: "[BOZZA] Cornice edittale — rapina aggravata (art. 628, co. 3 c.p.)"
category: legal_it
strategy: penal_range_draft
version: "0.1-draft"
description: >
  BOZZA DIMOSTRATIVA, NON VALIDATA LEGALMENTE. Calcola la cornice
  edittale della rapina aggravata ex art. 628, co. 3 c.p. (reclusione
  da 7 a 20 anni), che copre fra l'altro la rapina commessa con armi.
  Applica la stessa meccanica dimostrativa del modulo penale:
  circostanze come conteggi generici, scenari art. 69, tetti art. 66,
  riduzione per rito abbreviato. Presuppone che l'aggravante del co. 3
  sia GIÀ stata qualificata e confermata da un legale: il sistema non
  stabilisce se il fatto rientri nel co. 1 (rapina semplice) o nel
  co. 3. Non calcola la multa congiunta.
jurisdiction: IT
output_unit: null
keywords:
  - rapina aggravata
  - rapina a mano armata
  - rapina con armi
aliases:
  - che pena per rapina aggravata
  - che pena per una rapina a mano armata
tags:
  - penale
  - rapina
  - patrimonio
intent_examples:
  - pena per rapina aggravata
  - che pena per una rapina a mano armata
  - rapina commessa con armi che pena
negative_examples:
  - rapina semplice
  - rapina senza armi
required_context:
  - conferma da parte di un legale che ricorre un'aggravante ex art. 628, co. 3 c.p.
  - numero di circostanze aggravanti e attenuanti comuni ulteriori confermate dall'avvocato
ambiguity_notes: >
  La distinzione fra rapina semplice (co. 1) e aggravata (co. 3)
  dipende dalla qualificazione giuridica dell'aggravante, che deve
  essere confermata da un legale; il sistema non la accerta. Le
  ipotesi pluriaggravate del co. 4 hanno cornice propria non coperta
  da questa bozza.
inputs:
  - name: aggravanti_comuni
    type: integer
    required: true
    min_value: 0
    description: Numero di circostanze aggravanti comuni ULTERIORI confermate (0 se nessuna)
  - name: attenuanti_comuni
    type: integer
    required: true
    min_value: 0
    description: Numero di circostanze attenuanti comuni confermate (0 se nessuna)
  - name: scenario_art_69
    type: string
    required: false
    description: >
      Scenario di bilanciamento: aggravanti_prevalenti |
      attenuanti_prevalenti | equivalenza. Se omesso con entrambe le
      tipologie presenti, restituisce la matrice degli scenari.
  - name: rito_abbreviato
    type: boolean
    required: false
    default: false
    description: Applica la riduzione di 1/3 per giudizio abbreviato (art. 442 c.p.p.)
parameters: []
formula:
  base_min_years: 7
  base_max_years: 20
output:
  name: pena
citations:
  - reference: "Art. 628, co. 3 Codice Penale — Rapina aggravata (reclusione da sette a venti anni; cornice da verificare contro il testo vigente)"
    source_name: "Codice Penale (R.D. 19 ottobre 1930, n. 1398)"
    publisher: "Normattiva — Istituto Poligrafico e Zecca dello Stato"
    publication_date: "1930-10-19"
    url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:regio.decreto:1930-10-19;1398"
    official: true
warnings:
  - "Calcolo di cornice edittale sotto ipotesi dichiarate: NON è una previsione della sentenza."
  - "La cornice edittale dell'art. 628, co. 3 c.p. va verificata contro il testo vigente prima di qualsiasi uso: le pene della rapina sono state più volte riformate."
  - "La multa congiunta prevista dal co. 3 non è calcolata da questa bozza."
  - "Non copre le ipotesi pluriaggravate ex art. 628, co. 4 c.p."
assumptions:
  - "L'aggravante ex art. 628, co. 3 c.p. è già stata qualificata e confermata da un legale: il sistema riceve solo la cornice risultante e il numero di eventuali circostanze comuni ulteriori."
  - "Ogni circostanza comune ha effetto discrezionale da 0 a 1/3 (inviluppo massimo di legge)."
exclusions:
  - "Rapina pluriaggravata ex art. 628, co. 4 c.p. (cornice autonoma)."
  - "Multa congiunta; recidiva e continuazione; attenuante di lieve entità."
examples:
  - description: "Rapina aggravata ex art. 628 co. 3, nessuna circostanza comune ulteriore"
    inputs:
      aggravanti_comuni: 0
      attenuanti_comuni: 0
    expected_result:
      specie: reclusione
      pena_minima: "7 anni"
      pena_massima: "20 anni"
