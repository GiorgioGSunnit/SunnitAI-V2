# Alembic configuration for the policy comparator.
#
# The database URL is NOT set here — it is read from PC_DATABASE_URL by
# migrations/env.py, so a migration can never be pointed at the wrong database
# by an out-of-date checked-in value.
#
#   alembic -c policy_comparator/alembic.ini upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
