[project]
name = "policy-comparator"
version = "0.1.0"
description = "Internal staff tool for requesting and comparing Italian auto-insurance quotations across multiple providers."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic[email]>=2.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "cryptography>=42.0.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# The async tests drive coroutines through asyncio.run() from ordinary sync
# test functions, so no pytest-asyncio plugin is required.
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
]
# Browser automation is deliberately optional: every provider adapter works in
# mock mode, and the API/worker start cleanly without Playwright installed.
# Install with `pip install -e .[browser]` then `playwright install chromium`.
browser = [
    "playwright>=1.44.0",
]
postgres = [
    "psycopg2-binary>=2.9.9",
]

# This sub-project runs standalone. It does not import the parent repo's src/
# package; `pip install -e .[dev]` from this directory is enough to run it,
# and it also works inside the parent repo's shared virtual environment.

# This pyproject sits INSIDE the package it builds, so setuptools' automatic
# flat-layout discovery sees api/, models/, worker/ and the rest as competing
# top-level packages and refuses to build at all. Map the distribution's root
# package onto this directory and name the subpackages explicitly; the code
# imports `policy_comparator.*`, so that prefix has to survive installation.
[tool.setuptools]
package-dir = { "policy_comparator" = "." }
packages = [
    "policy_comparator",
    "policy_comparator.api",
    "policy_comparator.models",
    "policy_comparator.providers",
    "policy_comparator.schemas",
    "policy_comparator.services",
    "policy_comparator.worker",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
